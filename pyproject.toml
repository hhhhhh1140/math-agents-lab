[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-agents-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["langgraph>=1,<2", "httpx>=0.28,<1", "datasets>=3,<5", "math-verify>=0.8,<1", "sympy>=1.13,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
math-lab = "math_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
