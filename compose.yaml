name: math-agents-lab
services:
  lab:
    image: math-agents-lab:local
    build: .
    env_file:
      - path: .env
        format: raw
    environment:
      HF_HOME: /cache/huggingface
    dns:
      - 223.5.5.5
      - 119.29.29.29
    volumes:
      - ./data:/app/data
      - ./results:/app/results
      - ./.cache:/cache
      - ${MATH_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    init: true
  sandbox:
    image: math-agent-python:local
    build: ./sandbox
    profiles: [build-only]
